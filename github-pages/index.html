<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07191d" />
    <meta
      name="description"
      content="Inspect Revit metadata and recover experimental open geometry entirely in your browser. No upload, account, or telemetry."
    />
    <meta property="og:title" content="Reviter — Browser-only Revit converter" />
    <meta
      property="og:description"
      content="Open and process local RVT files entirely in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./og.png" />
    <link rel="icon" href="./favicon.png" />
    <title>Reviter — Browser-only Revit converter</title>
    <!--
      The same pre-paint theme restore `app/layout.tsx` runs. Without it the
      static build wrote the chosen theme to localStorage and never read it
      back, so the deployed site reset to dark on every load.
    -->
    <script>
      try {
        var t = localStorage.getItem("reviter.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
