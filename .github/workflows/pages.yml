name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Types are erased by --experimental-strip-types and never checked at
      # runtime, so this is the only place a type error can be caught at all.
      - name: Typecheck
        run: npm run typecheck

      # Glob discovery, so a newly added test file runs without being enumerated
      # anywhere. This replaces a hand-maintained list that had drifted to cover
      # 18 of the 135 test files on disk.
      - name: Test
        run: npm run test:unit

      - name: Build static application
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          REVITER_PARSER_VERSION: ${{ github.sha }}
        run: npm run build:pages

      - name: Verify Pages artifact
        run: node --test tests/pages-build.test.mjs

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    # Pull requests run every gate above but must not publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
