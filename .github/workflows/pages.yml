name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test converter
        run: node --experimental-strip-types --test tests/reviter-regression.test.ts tests/studio-overlay.test.ts tests/coverage-split.test.ts tests/door-leaf.test.ts tests/tail-placement.test.ts tests/studio-controls.test.ts

      - name: Build static application
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:pages

      - name: Verify Pages artifact
        run: node --test tests/pages-build.test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
