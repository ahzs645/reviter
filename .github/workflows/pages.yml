name: Deploy GitHub Pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reviter
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: reviter

      - name: Checkout sibling map for parity tests
        uses: actions/checkout@v6
        with:
          repository: ahzs645/openindoormaps
          ref: 65c85bb25ebfd8de1b00b05f3dc6373c4efa4240
          path: openindoormaps

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            reviter/package-lock.json
            openindoormaps/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install sibling map dependencies
        run: npm ci --prefix ../openindoormaps

      # Direct manual runs validate themselves. CI calls this only after check.
      - name: Validate standalone manual build
        if: github.event_name == 'workflow_dispatch'
        run: npm run lint && npm run typecheck && npm run test:unit && npm run test:autodesk

      - name: Build static application
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          REVITER_PARSER_VERSION: ${{ github.sha }}
        run: npm run build:pages

      - name: Verify Pages artifact
        run: node --test tests/pages-build.test.mjs

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: reviter/dist-pages

  deploy:
    # Pull requests run every gate above but must not publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
