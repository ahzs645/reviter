name: CI

# Canonical validation; Pages construction depends on this result.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: reviter
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: reviter

      - name: Checkout sibling map for parity tests
        uses: actions/checkout@v6
        with:
          repository: ahzs645/openindoormaps
          ref: 65c85bb25ebfd8de1b00b05f3dc6373c4efa4240
          path: openindoormaps

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # package.json declares engines.node >= 22.13.0; 22 resolves to the
          # latest 22.x. rvt_to_ifc.py in the consuming repo reads that floor
          # rather than duplicating it, so raise it there first.
          node-version: 22
          # Caches ~/.npm, keyed on package-lock.json.
          cache: npm
          cache-dependency-path: |
            reviter/package-lock.json
            openindoormaps/package-lock.json

      # ci, not install: the lockfile is authoritative and a drifted
      # package.json should fail here rather than be silently reconciled.
      - name: Install dependencies
        run: npm ci

      - name: Install sibling map dependencies
        run: npm ci --prefix ../openindoormaps

      - name: Lint
        run: npm run lint

      # Types are erased by --experimental-strip-types and never checked at
      # runtime, so tsc is the only place a type error can surface at all.
      - name: Typecheck
        run: npm run typecheck

      # Glob discovery over tests/**/*.test.ts, so a newly added test file runs
      # without being enumerated anywhere. ~1000 assertions across 155 files in
      # about 20 s. Two cases self-skip unless REVITER_ODA_ROOT or
      # REVITER_MODEL_2027 point at inputs that are in no repository; that is
      # intended, and is what keeps this suite runnable on a bare runner.
      - name: Unit tests
        run: npm run test:unit

      # The Autodesk pipeline tests are a .mjs file, so the test:unit glob
      # (tests/**/*.test.ts) does not reach them and they had no gate. They
      # need no network and no tools/autodesk install -- 8 tests in under a
      # second -- so there is no reason for them not to run here.
      - name: Autodesk pipeline tests
        run: npm run test:autodesk

  pages:
    needs: check
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
